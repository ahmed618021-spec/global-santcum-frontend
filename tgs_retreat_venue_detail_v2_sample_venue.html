    <!-- ═══ tgsTrackOnce — single-fire dataLayer guard ═══════════════════════
         Production code (Kane's team) calls window.tgsTrackOnce(name, payload)
         instead of dataLayer.push directly. Each event payload must include a
         unique submissionId or interactionId for deduplication.
         See Implementation Requirements PDF, Items 24-26.
         ═══════════════════════════════════════════════════════════════════ -->
    <script>
    window.__tgsEventsFired = window.__tgsEventsFired || {};
    window.tgsTrackOnce = function(eventName, payload) {
        payload = payload || {};
        var key = eventName + "_" + (payload.submissionId || payload.interactionId || "default");
        if (window.__tgsEventsFired[key]) return false;
        window.__tgsEventsFired[key] = true;
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push(Object.assign({ event: eventName }, payload));
        return true;
    };
    </script>

    <style>
        /* ═══════════════════════════════════════════════════════════════
           DESIGN SYSTEM
           ═══════════════════════════════════════════════════════════════ */
        
        :root {
            --warm-white: #FDFCF9;
            --warm-cream: #F7F5F1;
            --warm-charcoal: #3A3A3A;
            --charcoal: #313131;
            --charcoal-80: rgba(49, 49, 49, 0.8);
            --charcoal-70: rgba(49, 49, 49, 0.7);
            --charcoal-light: rgba(49, 49, 49, 0.7);
            --charcoal-lighter: rgba(49, 49, 49, 0.5);
            --charcoal-50: rgba(49, 49, 49, 0.5);
            --charcoal-30: rgba(49, 49, 49, 0.3);
            --charcoal-15: rgba(49, 49, 49, 0.15);
            --charcoal-border: rgba(49, 49, 49, 0.15);
            --charcoal-subtle: rgba(49, 49, 49, 0.1);
            --charcoal-10: rgba(49, 49, 49, 0.1);
            --charcoal-08: rgba(49, 49, 49, 0.08);
            --charcoal-05: rgba(49, 49, 49, 0.05);
            --gold: #C4A265;
            --gold-accent: #C4A265;
            --gold-dark: #7A644F;
            --canyon-clay: #7A644F;
            --mist: #8B8B8B;
            --light-rule: #E0D8CC;

            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Montserrat', sans-serif;

            --section-padding: 100px;
            --container-width: 1200px;
            --text-width: 680px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font-serif);
            color: var(--charcoal);
            background-color: var(--warm-white);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        img { max-width: 100%; height: auto; display: block; }

        /* ═══════════════════════════════════════════════════
           SKIP TO CONTENT (accessibility)
           ═══════════════════════════════════════════════════ */
        .skip-to-content {
            position: absolute; top: -100px; left: 16px;
            background: var(--charcoal); color: var(--warm-white);
            padding: 12px 20px; z-index: 9999;
            font-family: var(--font-sans); font-size: 13px; font-weight: 500;
            letter-spacing: 0.05em; text-transform: uppercase;
            transition: top 0.2s; text-decoration: none;
        }
        .skip-to-content:focus { top: 16px; outline: 2px solid var(--gold-accent); }

        /* ═══════════════════════════════════════════════════
           SAMPLE LISTING RIBBON (placeholder venue indicator)
           Removed in production once real venues onboarded.
           Database flag: venue.is_sample_listing = false
           ═══════════════════════════════════════════════════ */
        .sample-ribbon {
            position: absolute;
            top: 110px;
            right: 32px;
            z-index: 30;
            background: rgba(49, 49, 49, 0.85);
            backdrop-filter: blur(6px);
            padding: 10px 18px 10px 18px;
            border: 1px solid var(--gold-accent);
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: right;
            line-height: 1.3;
        }
        .sample-ribbon-eyebrow {
            font-family: var(--font-sans);
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gold-accent);
        }
        .sample-ribbon-text {
            font-family: var(--font-serif);
            font-size: 12px;
            font-weight: 400;
            font-style: italic;
            color: rgba(255,255,255,0.92);
            letter-spacing: 0.03em;
        }
        @media (max-width: 768px) {
            .sample-ribbon {
                top: 84px;
                right: 16px;
                padding: 8px 14px;
            }
            .sample-ribbon-eyebrow { font-size: 7px; }
            .sample-ribbon-text { font-size: 11px; }
        }
        
        /* ═══════════════════════════════════════════════════════════════
           SITE HEADER
           ═══════════════════════════════════════════════════════════════ */
        
        /* ═══════════════════════════════════════════════════
           NAVIGATION (matches standard pattern across all pages)
           Transparent over hero gallery with scrim+blur for readability,
           fades to opaque cream on scroll past hero.
           ═══════════════════════════════════════════════════ */
        .nav {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 24px 48px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.20) 0%, rgba(0,0,0,0) 100%);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid transparent;
            transition: background 0.3s ease, backdrop-filter 0.3s ease, border-color 0.3s ease;
        }
        .nav.scrolled {
            background: rgba(253, 252, 249, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--charcoal-08);
        }
        .nav-inner {
            max-width: 1400px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            gap: 24px;
        }
        .nav-left { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .nav-hamburger {
            display: flex; flex-direction: column; gap: 4px;
            background: transparent; border: none; padding: 0;
            cursor: pointer; color: inherit;
        }
        .nav-hamburger:focus-visible { outline: 2px solid var(--gold-accent); outline-offset: 4px; }
        .nav-hamburger span {
            width: 22px; height: 1px; background: #FFFFFF;
            transition: background 0.3s, transform 0.3s, opacity 0.3s;
            display: block;
        }
        .nav.scrolled .nav-hamburger span { background: var(--charcoal); }
        .nav-hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(4px, 4px); }
        .nav-hamburger.active span:nth-child(2) { opacity: 0; }
        .nav-hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(4px, -4px); }
        .nav-hamburger-label {
            font-family: var(--font-sans); font-size: 11px; font-weight: 500;
            letter-spacing: 0.22em; text-transform: uppercase;
            color: #FFFFFF; transition: color 0.3s;
        }
        .nav.scrolled .nav-hamburger-label { color: var(--charcoal); }
        .nav-logo-area {
            display: flex; align-items: center; gap: 14px;
            color: #FFFFFF; transition: color 0.3s;
            text-decoration: none;
        }
        .nav.scrolled .nav-logo-area { color: var(--charcoal); }
        .nav-logo {
            width: 40px; height: 40px;
            border: 1px solid var(--gold-accent);
            transform: rotate(45deg);
            position: relative;
        }
        .nav-logo::after {
            content: ""; position: absolute; inset: 4px;
            border: 1px solid var(--gold-accent);
        }
        .nav-brand-text {
            font-family: var(--font-serif); font-size: 18px;
            font-weight: 400; letter-spacing: 0.32em;
            text-transform: uppercase;
            color: inherit;
        }
        .nav-right { width: 80px; }

        /* ═══════════════════════════════════════════════════
           DRAWER (matches standard pattern)
           ═══════════════════════════════════════════════════ */
        .drawer-overlay {
            position: fixed; inset: 0; z-index: 998;
            background: rgba(49,49,49,0.45);
            backdrop-filter: blur(2px);
            opacity: 0; visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .drawer-overlay.active { opacity: 1; visibility: visible; }

        .drawer {
            position: fixed; top: 0; left: 0;
            width: 440px; max-width: 90vw; height: 100vh;
            background: var(--warm-white); z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .drawer.active { transform: translateX(0); }
        .drawer-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 24px 36px;
            border-bottom: 1px solid var(--charcoal-08);
            flex-shrink: 0;
        }
        .drawer-header-left { display: flex; align-items: center; gap: 12px; }
        .drawer-logo {
            width: 32px; height: 32px;
            border: 1px solid var(--gold-accent);
            transform: rotate(45deg); position: relative;
        }
        .drawer-logo::after {
            content: ""; position: absolute; inset: 3px;
            border: 1px solid var(--gold-accent);
        }
        .drawer-label {
            font-family: var(--font-sans); font-size: 10px;
            font-weight: 500; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--charcoal-50);
        }
        .drawer-close {
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid var(--charcoal-08); background: var(--warm-cream);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--charcoal-50);
            transition: all 0.25s;
        }
        .drawer-close:hover { border-color: var(--charcoal-30); color: var(--charcoal); }
        .drawer-search {
            padding: 20px 36px;
            border-bottom: 1px solid var(--charcoal-08);
            flex-shrink: 0;
        }
        .drawer-search-bar {
            display: flex; align-items: center; gap: 10px;
            background: var(--warm-cream); border: 1px solid var(--charcoal-08);
            border-radius: 50px; padding: 10px 18px;
            transition: border-color 0.2s;
        }
        .drawer-search-bar:focus-within { border-color: var(--charcoal-30); }
        .drawer-search-bar svg { width: 16px; height: 16px; color: var(--charcoal-30); flex-shrink: 0; }
        .drawer-search-bar input {
            flex: 1; border: none; outline: none; background: transparent;
            font-family: var(--font-sans); font-size: 13px; color: var(--charcoal);
        }
        .drawer-search-bar input::placeholder { color: var(--charcoal-30); }
        .drawer-body { flex: 1; overflow-y: auto; padding: 28px 36px; }
        .drawer-group { margin-bottom: 32px; }
        .drawer-group:last-child { margin-bottom: 0; }
        .drawer-group-label {
            font-family: var(--font-sans); font-size: 9px;
            font-weight: 600; letter-spacing: 0.25em;
            text-transform: uppercase; color: var(--charcoal);
            margin-bottom: 12px; padding-left: 2px;
        }
        .drawer-link {
            display: flex; align-items: center; justify-content: space-between;
            font-family: var(--font-serif); font-size: 26px; font-weight: 300;
            color: var(--charcoal); padding: 12px 0;
            border-bottom: 1px solid var(--charcoal-05);
            transition: color 0.3s, padding-left 0.3s;
            text-decoration: none;
        }
        .drawer-link:last-child { border-bottom: none; }
        .drawer-link:hover { color: var(--charcoal-70); padding-left: 6px; }
        .drawer-link-arrow { font-size: 18px; color: var(--charcoal-15); transition: color 0.3s, transform 0.3s; }
        .drawer-link:hover .drawer-link-arrow { color: var(--charcoal-50); transform: translateX(4px); }
        .drawer-secondary-link {
            display: flex; align-items: center; gap: 10px;
            font-family: var(--font-serif); font-size: 26px; font-weight: 300;
            color: var(--charcoal); padding: 10px 0;
            transition: color 0.2s, padding-left 0.2s;
            text-decoration: none;
        }
        .drawer-secondary-link:hover { color: var(--charcoal-70); padding-left: 4px; }
        .drawer-cta {
            display: block; width: 100%; text-align: center;
            background: var(--charcoal); color: #FFFFFF;
            font-family: var(--font-sans); font-size: 11px; font-weight: 500;
            letter-spacing: 0.2em; text-transform: uppercase;
            padding: 16px 24px; transition: background 0.3s; margin-top: 8px;
            text-decoration: none;
        }
        .drawer-cta:hover { background: var(--warm-charcoal); }
        .drawer-footer {
            padding: 24px 36px;
            border-top: 1px solid var(--charcoal-08);
            background: var(--warm-cream); flex-shrink: 0;
        }
        .drawer-footer-contact {
            display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;
        }
        .drawer-footer-item {
            display: flex; align-items: center; gap: 10px;
            font-family: var(--font-sans); font-size: 12px;
            color: var(--charcoal-50); transition: color 0.2s;
            text-decoration: none;
        }
        .drawer-footer-item:hover { color: var(--charcoal); }
        .drawer-footer-item svg { width: 14px; height: 14px; flex-shrink: 0; }
        .drawer-social { display: flex; gap: 10px; }
        .drawer-social a {
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid var(--charcoal-08);
            display: flex; align-items: center; justify-content: center;
            color: var(--charcoal-50); font-family: var(--font-sans);
            font-size: 11px; font-weight: 500; transition: all 0.2s;
            text-decoration: none;
        }
        .drawer-social a:hover { border-color: var(--charcoal); color: var(--charcoal); }
        
        /* ═══════════════════════════════════════════════════════════════
           HERO GALLERY
           ═══════════════════════════════════════════════════════════════ */
        
        .hero-gallery {
            position: relative;
            height: 85vh;
            min-height: 600px;
            max-height: 900px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.4)),
                        url('https://images.unsplash.com/photo-1600618528240-fb9fc964b853?w=1920&q=80') center/cover;
        }
        
        .hero-content {
            position: absolute;
            bottom: 140px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
        }
        
        .hero-venue-name {
            font-family: var(--font-serif);
            font-size: 56px;
            font-weight: 400;
            margin-bottom: 12px;
        }
        
        .hero-location {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        
        .hero-view-photos {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .hero-view-photos:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
        }
        
        .hero-thumbnails {
            position: absolute;
            bottom: 30px;
            left: 40px;
            display: flex;
            gap: 10px;
        }
        
        .hero-thumb {
            width: 100px;
            height: 70px;
            border-radius: 4px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }
        
        .hero-thumb:hover {
            opacity: 1;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           STICKY INFO BAR
           ═══════════════════════════════════════════════════════════════ */
        
        .sticky-info-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--warm-white);
            border-bottom: 1px solid var(--charcoal-subtle);
            padding: 0 40px;
            display: none;
        }
        
        .sticky-info-bar.visible {
            display: block;
        }
        
        .sticky-info-inner {
            max-width: var(--container-width);
            margin: 0 auto;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .sticky-info-left h2 {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 400;
            color: var(--charcoal);
        }
        
        .sticky-info-left p {
            font-family: var(--font-sans);
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--charcoal-lighter);
        }
        
        .sticky-info-right {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        
        .sticky-stats {
            font-family: var(--font-serif);
            font-size: 15px;
            color: var(--charcoal-light);
        }
        
        .sticky-stats span {
            margin: 0 8px;
            color: var(--charcoal-lighter);
        }
        
        .sticky-cta {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 14px 28px;
            background: var(--charcoal);
            color: white;
            text-decoration: none;
            border-radius: 2px;
            transition: opacity 0.3s ease;
        }
        
        .sticky-cta:hover {
            opacity: 0.85;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           TAB NAVIGATION
           ═══════════════════════════════════════════════════════════════ */
        
        .tab-nav {
            position: sticky;
            top: 0;
            z-index: 99;
            background: var(--warm-white);
            border-bottom: 1px solid var(--charcoal-subtle);
        }
        
        .tab-nav-inner {
            max-width: var(--container-width);
            margin: 0 auto;
            display: flex;
            gap: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 40px;
        }
        
        .tab-nav-inner::-webkit-scrollbar {
            display: none;
        }
        
        .tab {
            padding: 22px 28px;
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--charcoal-light);
            text-decoration: none;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        
        .tab:hover {
            color: var(--charcoal);
        }
        
        .tab.active {
            color: var(--charcoal);
            border-bottom-color: var(--charcoal);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           MAIN LAYOUT
           ═══════════════════════════════════════════════════════════════ */
        
        .main-content {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .content-area {
            flex: 1;
            min-width: 0;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           FLOATING SIDEBAR
           ═══════════════════════════════════════════════════════════════ */
        
        .floating-sidebar {
            width: 340px;
            padding: 30px;
            position: sticky;
            top: 80px;
            height: fit-content;
            margin-left: 40px;
        }
        
        .sidebar-card {
            background: var(--warm-white);
            border: 1px solid var(--charcoal-border);
            border-radius: 4px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        
        .sidebar-price-label {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--charcoal-lighter);
            margin-bottom: 8px;
        }
        
        .sidebar-price {
            font-family: var(--font-serif);
            font-size: 36px;
            font-weight: 300;
            color: var(--charcoal);
            margin-bottom: 4px;
        }
        
        .sidebar-price span {
            font-size: 16px;
        }
        
        .sidebar-price-period {
            font-family: var(--font-serif);
            font-size: 15px;
            color: var(--charcoal-light);
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--charcoal-subtle);
        }
        
        .sidebar-stats {
            margin-bottom: 24px;
        }
        
        .sidebar-stat {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            font-family: var(--font-serif);
            font-size: 15px;
            color: var(--charcoal-light);
        }
        
        .sidebar-stat svg {
            width: 18px;
            height: 18px;
            stroke: var(--charcoal);
            stroke-width: 1.5;
            fill: none;
        }
        
        .sidebar-enquire {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--charcoal);
            color: white;
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            transition: opacity 0.3s ease;
            margin-bottom: 16px;
        }
        
        .sidebar-enquire:hover {
            opacity: 0.85;
        }
        
        .sidebar-save {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--charcoal);
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            border: 1px solid var(--charcoal-border);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .sidebar-save:hover {
            border-color: var(--charcoal);
        }
        
        .sidebar-save svg {
            width: 16px;
            height: 16px;
            stroke: var(--charcoal);
            stroke-width: 1.5;
            fill: none;
        }
        
        .sidebar-response {
            font-family: var(--font-serif);
            font-size: 14px;
            font-style: italic;
            color: var(--charcoal-lighter);
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--charcoal-subtle);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           SECTION STYLING
           ═══════════════════════════════════════════════════════════════ */
        
        .section {
            padding: var(--section-padding) 40px;
        }
        
        .section--cream {
            background: var(--warm-cream);
        }
        
        .section--white {
            background: var(--warm-white);
        }
        
        .section--charcoal {
            background: var(--charcoal);
            color: white;
        }
        
        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .section-label {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--charcoal);
            margin-bottom: 16px;
        }
        
        .section--charcoal .section-label {
            color: rgba(255,255,255,0.7);
        }
        
        .section-title {
            font-family: var(--font-serif);
            font-size: 36px;
            font-weight: 400;
            color: var(--charcoal);
            margin-bottom: 12px;
        }
        
        .section--charcoal .section-title {
            color: white;
        }
        
        .section-subtitle {
            font-family: var(--font-serif);
            font-size: 17px;
            font-weight: 300;
            font-style: italic;
            color: var(--charcoal-light);
        }
        
        .section--charcoal .section-subtitle {
            color: rgba(255,255,255,0.7);
        }
        
        .container {
            max-width: var(--container-width);
            margin: 0 auto;
        }
        
        .container--narrow {
            max-width: var(--text-width);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           TAB HERO
           ═══════════════════════════════════════════════════════════════ */
        
        .tab-hero {
            position: relative;
            height: 70vh;
            min-height: 500px;
            max-height: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-size: cover;
            background-position: center;
        }
        
        .tab-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.5));
        }
        
        .tab-hero-content {
            position: relative;
            z-index: 1;
            color: white;
            max-width: 700px;
            padding: 0 40px;
        }
        
        .tab-hero-label {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        
        .tab-hero-title {
            font-family: var(--font-serif);
            font-size: 42px;
            font-weight: 400;
            margin-bottom: 16px;
        }
        
        .tab-hero-subtitle {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 300;
            font-style: italic;
            opacity: 0.9;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           INTRO SECTION
           ═══════════════════════════════════════════════════════════════ */
        
        .intro-text {
            max-width: var(--text-width);
            margin: 0 auto;
            text-align: center;
        }
        
        .intro-line {
            width: 60px;
            height: 1px;
            background: var(--charcoal-lighter);
            margin: 0 auto 40px;
        }
        
        .intro-text p {
            font-family: var(--font-serif);
            font-size: 19px;
            font-weight: 300;
            line-height: 1.9;
            color: var(--charcoal);
            margin-bottom: 24px;
        }
        
        .intro-text p:last-child {
            margin-bottom: 0;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           STATS GRID
           ═══════════════════════════════════════════════════════════════ */
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }
        
        .stat-item {
            text-align: center;
            padding: 30px 20px;
            background: var(--warm-cream);
            border-radius: 4px;
        }
        
        .section--cream .stat-item {
            background: var(--warm-white);
        }
        
        .stat-value {
            font-family: var(--font-serif);
            font-size: 42px;
            font-weight: 300;
            color: var(--charcoal);
            line-height: 1;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--charcoal-lighter);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           FEATURE BLOCK
           ═══════════════════════════════════════════════════════════════ */
        
        .feature-block {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }
        
        .feature-block--reverse {
            direction: rtl;
        }
        
        .feature-block--reverse > * {
            direction: ltr;
        }
        
        .feature-image {
            aspect-ratio: 4/3;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .feature-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .feature-content {
            
        }
        
        .feature-label {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--charcoal-lighter);
            margin-bottom: 16px;
        }
        
        .feature-title {
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: 400;
            color: var(--charcoal);
            margin-bottom: 20px;
            line-height: 1.3;
        }
        
        .feature-text {
            font-family: var(--font-serif);
            font-size: 16px;
            font-weight: 300;
            line-height: 1.8;
            color: var(--charcoal-light);
            margin-bottom: 24px;
        }
        
        .feature-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .tag {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.5px;
            padding: 10px 18px;
            background: var(--warm-cream);
            border: 1px solid var(--charcoal-border);
            border-radius: 2px;
            color: var(--charcoal-light);
        }
        
        .section--cream .tag {
            background: var(--warm-white);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           CARD GRIDS
           ═══════════════════════════════════════════════════════════════ */
        
        .card-grid {
            display: grid;
            gap: 30px;
        }
        
        .card-grid--3 {
            grid-template-columns: repeat(3, 1fr);
        }
        
        .card-grid--2 {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .card-grid--4 {
            grid-template-columns: repeat(4, 1fr);
        }
        
        .card {
            background: var(--warm-cream);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .section--cream .card {
            background: var(--warm-white);
        }
        
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(49, 49, 49, 0.08);
        }
        
        .card-image {
            aspect-ratio: 3/2;
            overflow: hidden;
        }
        
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .card:hover .card-image img {
            transform: scale(1.05);
        }
        
        .card-content {
            padding: 24px;
        }
        
        .card-title {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 400;
            color: var(--charcoal);
            margin-bottom: 8px;
        }
        
        .card-meta {
            font-family: var(--font-serif);
            font-size: 14px;
            font-weight: 300;
            color: var(--charcoal-light);
            margin-bottom: 12px;
        }
        
        .card-description {
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 300;
            line-height: 1.7;
            color: var(--charcoal-light);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           ICON GRID
           ═══════════════════════════════════════════════════════════════ */
        
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
        }
        
        .icon-item {
            text-align: center;
        }
        
        .icon-wrapper {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            stroke: var(--charcoal);
            stroke-width: 1.5;
            fill: none;
        }
        
        .icon-label {
            font-family: var(--font-serif);
            font-size: 16px;
            font-weight: 400;
            color: var(--charcoal);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           VIEW ALL LINK
           ═══════════════════════════════════════════════════════════════ */
        
        .view-all {
            text-align: center;
            margin-top: 50px;
        }
        
        .view-all a {
            font-family: var(--font-serif);
            font-size: 16px;
            font-weight: 400;
            color: var(--charcoal);
            text-decoration: none;
            border-bottom: 1px solid var(--charcoal);
            padding-bottom: 2px;
            transition: opacity 0.3s ease;
        }
        
        .view-all a:hover {
            opacity: 0.7;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           HOST SECTION
           ═══════════════════════════════════════════════════════════════ */
        
        .host-image {
            aspect-ratio: 4/5;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .host-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           IMAGE BREAK
           ═══════════════════════════════════════════════════════════════ */
        
        .image-break {
            height: 50vh;
            min-height: 350px;
            max-height: 500px;
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
        }
        
        @media (max-width: 768px) {
            .image-break {
                background-attachment: scroll;
            }
        }
        
        /* ═══════════════════════════════════════════════════════════════
           AMENITY LISTS
           ═══════════════════════════════════════════════════════════════ */
        
        .amenity-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }
        
        .amenity-column-title {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--charcoal);
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--charcoal);
        }
        
        .amenity-item {
            padding: 20px 0;
            border-bottom: 1px solid var(--charcoal-subtle);
        }
        
        .amenity-item:last-child {
            border-bottom: none;
        }
        
        .amenity-name {
            font-family: var(--font-serif);
            font-size: 18px;
            font-weight: 400;
            color: var(--charcoal);
            margin-bottom: 4px;
        }
        
        .amenity-detail {
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 300;
            color: var(--charcoal-light);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           POLICY CARDS
           ═══════════════════════════════════════════════════════════════ */
        
        .policy-card {
            padding: 40px;
            background: var(--warm-cream);
            border-radius: 4px;
        }
        
        .section--cream .policy-card {
            background: var(--warm-white);
        }
        
        .policy-card-title {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--charcoal);
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--charcoal-border);
        }
        
        .policy-item {
            margin-bottom: 16px;
        }
        
        .policy-item:last-child {
            margin-bottom: 0;
        }
        
        .policy-item-label {
            font-family: var(--font-serif);
            font-size: 17px;
            font-weight: 400;
            color: var(--charcoal);
            margin-bottom: 4px;
        }
        
        .policy-item-value {
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 300;
            color: var(--charcoal-light);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           PRICING SECTION
           ═══════════════════════════════════════════════════════════════ */
        
        .pricing-hero {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .pricing-from {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--charcoal-lighter);
            margin-bottom: 8px;
        }
        
        .pricing-amount {
            font-family: var(--font-serif);
            font-size: 64px;
            font-weight: 300;
            color: var(--charcoal);
            line-height: 1;
        }
        
        .pricing-amount span {
            font-size: 24px;
            vertical-align: top;
            margin-right: 4px;
        }
        
        .pricing-period {
            font-family: var(--font-serif);
            font-size: 18px;
            font-weight: 300;
            color: var(--charcoal-light);
            margin-top: 8px;
        }
        
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .pricing-card {
            background: var(--warm-cream);
            border-radius: 4px;
            padding: 40px;
            text-align: center;
        }
        
        .section--cream .pricing-card {
            background: var(--warm-white);
        }
        
        .pricing-card--featured {
            border: 2px solid var(--charcoal);
            position: relative;
        }
        
        .pricing-card-badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--charcoal);
            color: var(--warm-white);
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 2px;
        }
        
        .pricing-card-season {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--charcoal-lighter);
            margin-bottom: 8px;
        }
        
        .pricing-card-dates {
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 300;
            color: var(--charcoal-light);
            margin-bottom: 24px;
        }
        
        .pricing-card-amount {
            font-family: var(--font-serif);
            font-size: 42px;
            font-weight: 300;
            color: var(--charcoal);
            margin-bottom: 4px;
        }
        
        .pricing-card-amount span {
            font-size: 18px;
            vertical-align: top;
        }
        
        .pricing-card-unit {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            color: var(--charcoal-lighter);
        }
        
        .quick-facts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-top: 60px;
        }
        
        .quick-fact {
            text-align: center;
            padding: 30px 20px;
            background: var(--warm-cream);
            border-radius: 4px;
        }
        
        .section--cream .quick-fact {
            background: var(--warm-white);
        }
        
        .quick-fact-value {
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: 400;
            color: var(--charcoal);
            margin-bottom: 8px;
        }
        
        .quick-fact-label {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;

    <script>
        // ═══ EMAIL OBFUSCATION CONVERTER ═══════════════════════════════════
        // Converts <a class="email-link" data-u="..." data-d="..."> elements
        // into real mailto: links on page load. Plain "hello@..." text is
        // never present in raw HTML — harvester crawlers grepping for @ get
        // nothing usable. JS-enabled humans see the real email and can click.
        (function() {
            document.querySelectorAll('.email-link').forEach(function(el) {
                var user = el.dataset.u;
                var host = el.dataset.d;
                if (!user || !host) return;
                var email = user + '@' + host;
                el.setAttribute('href', 'mailto:' + email);
                var textEl = el.querySelector('.email-text');
                if (textEl) textEl.textContent = email;
            });
        })();

        // Nav scroll effect + sticky info bar reveal
        const stickyBar = document.getElementById('stickyInfoBar');

        window.addEventListener('scroll', () => {
            document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 20);

            if (window.scrollY > 600) {
                stickyBar.classList.add('visible');
            } else {
                stickyBar.classList.remove('visible');
            }
        });

        // ═══ DRAWER TOGGLE (standard ARIA-aware pattern) ═══
        function toggleDrawer() {
            const hamburger = document.getElementById('navHamburger');
            const drawer = document.getElementById('navDrawer');
            const overlay = document.getElementById('drawerOverlay');
            hamburger.classList.toggle('active');
            drawer.classList.toggle('active');
            overlay.classList.toggle('active');
            const isOpen = drawer.classList.contains('active');
            hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            hamburger.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
            drawer.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
            overlay.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
            document.body.style.overflow = isOpen ? 'hidden' : '';
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('navDrawer').classList.contains('active')) toggleDrawer();
        });
        
        // Tab switching
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');
        
        function switchTab(tabId) {
            tabs.forEach(tab => {
                if (tab.dataset.tab === tabId) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            tabContents.forEach(content => {
                if (content.id === tabId) {
                    content.classList.add('active');
                } else {
                    content.classList.remove('active');
                }
            });
            
            // Scroll to top of content
            window.scrollTo({ top: 500, behavior: 'smooth' });
        }
        
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                switchTab(tab.dataset.tab);
            });
        });
        
        // FAQ accordion
        document.querySelectorAll('.faq-question').forEach(question => {
            question.addEventListener('click', () => {
                const item = question.parentElement;
                const isActive = item.classList.contains('active');
                
                document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('active'));
                
                if (!isActive) {
                    item.classList.add('active');
                }
            });
        });
    </script>

    <!-- ═══ PAGE META EVENT — fires on page mount via tgsTrackOnce ═══════════
         Architecture doc Part 8 Standard Event: page_meta
         Payload: page_type=venue_detail, page_category=retreat-venues,
                  venue_slug={{venue.slug}}, page_path=/retreat-venues/{{venue.slug}}
         is_sample_listing flag is sent so analytics can segment real vs sample
         engagement during the pre-launch period.
         ═══════════════════════════════════════════════════════════════════════ -->
    <script>
    (function() {
        if (typeof window.tgsTrackOnce !== 'function') return;
        window.tgsTrackOnce('page_meta', {
            interactionId: 'page_meta_' + window.location.pathname,
            page_type: 'venue_detail',
            page_category: 'retreat-venues',
            venue_slug: 'santosa-retreat',
            is_sample_listing: true,
            page_path: window.location.pathname
        });
    })();
    </script>
